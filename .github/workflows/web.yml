name: web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  deployments: write

defaults:
  run:
    working-directory: ./web

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.24.0

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies 📦
        run: pnpm install --no-frozen-lockfile

      - name: Run linter 👀
        run: pnpm lint

      - name: Run tests 🧪
        run: pnpm test

      - name: Build 🏗️
        run: mv .env.production .env && echo "GITHUB_SHA=${GITHUB_SHA}" >> .env && pnpm run generate

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.24.0

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies 📦
        run: pnpm install --no-frozen-lockfile

      - name: Build 🏗️
        run: mv .env.production .env && echo "GITHUB_SHA=${GITHUB_SHA}" >> .env && pnpm run generate

      - name: Firebase Deploy 🚀
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          channelId: live
          entryPoint: "./web"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_HTTPSMS_PROD }}"
          projectId: httpsms-prod
